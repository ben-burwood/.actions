name: Docker Build & Push

on:
  workflow_call:
    inputs:
      platforms:
        description: "Target build platforms"
        type: string
        default: linux/amd64,linux/arm64
      context:
        description: "Docker build context"
        type: string
        default: .
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: Dockerfile
      image-name:
        description: "Image name; defaults to the calling repository (owner/repo)"
        type: string
        default: ""
      dockerhub:
        description: "Also push to Docker Hub"
        type: boolean
        default: true
      attestation:
        description: "Generate build-provenance attestation (GHCR)"
        type: boolean
        default: true
      push:
        description: "Push images (set false for build-only / PR validation)"
        type: boolean
        default: true
      runs-on:
        description: "Runner label"
        type: string
        default: ubuntu-latest
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  build-and-push:
    name: Build and Push Docker image
    runs-on: ${{ inputs.runs-on }}

    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    env:
      IMAGE_NAME: ${{ inputs.image-name != '' && inputs.image-name || github.repository }}

    steps:
      - uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ inputs.dockerhub }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
            ${{ inputs.dockerhub && format('{0}/{1}', secrets.DOCKER_USERNAME, github.event.repository.name) || '' }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        if: ${{ inputs.attestation && inputs.push }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
